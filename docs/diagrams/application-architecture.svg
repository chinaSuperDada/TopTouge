<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5a6b7d"/>
    </marker>
    <style>
      .band  { font-size:15px; font-weight:700; fill:#33475b; }
      .bt    { font-size:12.5px; font-weight:700; fill:#1f2d3d; }
      .bs    { font-size:10px; fill:#5a6b7d; }
      .tag   { font-size:9.5px; fill:#7a8a9a; }
      .note  { font-size:10.5px; fill:#6b7a8a; }
    </style>
  </defs>

  <rect width="1080" height="880" fill="#fbfcfd"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1f2d3d">TopTouge 应用架构图</text>
  <text x="40" y="64" font-size="12" fill="#7a8a9a">跑山路线小程序 · 阶段一：路线库</text>

  <!-- ========== 小程序层 ========== -->
  <rect x="40" y="92" width="1000" height="238" rx="10" fill="#f0f7ff" stroke="#c3ddf5"/>
  <text x="58" y="116" class="band">微信小程序（表现层）</text>
  <text x="58" y="134" class="tag">miniprogram/</text>

  <rect x="60" y="148" width="300" height="164" rx="8" fill="#fff" stroke="#a9cdea"/>
  <text x="76" y="170" class="bt">pages/ 页面</text>
  <rect x="74" y="182" width="272" height="32" rx="5" fill="#e8f3ff" stroke="#bcdcfa"/>
  <text x="86" y="196" class="bt">route-list</text>
  <text x="86" y="208" class="bs">路线列表：名称 / 距离 / 星级</text>
  <rect x="74" y="220" width="272" height="32" rx="5" fill="#e8f3ff" stroke="#bcdcfa"/>
  <text x="86" y="234" class="bt">route-detail</text>
  <text x="86" y="246" class="bs">地图轨迹 + 难度 + 评论 + 路况</text>
  <rect x="74" y="258" width="272" height="32" rx="5" fill="#e8f3ff" stroke="#bcdcfa"/>
  <text x="86" y="272" class="bt">route-upload</text>
  <text x="86" y="284" class="bs">地图点选坐标 + 表单提交</text>

  <rect x="380" y="148" width="280" height="164" rx="8" fill="#fff" stroke="#a9cdea"/>
  <text x="396" y="170" class="bt">components/ 组件</text>
  <text x="396" y="194" class="bs">route-card</text>
  <text x="396" y="214" class="bs">difficulty-panel</text>
  <text x="396" y="234" class="bs">comment-list</text>
  <text x="396" y="254" class="bs">road-condition-list</text>
  <line x1="396" y1="268" x2="644" y2="268" stroke="#e3eef8"/>
  <text x="396" y="286" class="tag">纯展示，事件上抛</text>
  <text x="396" y="300" class="tag">不含业务逻辑</text>

  <rect x="680" y="148" width="340" height="164" rx="8" fill="#fff" stroke="#a9cdea"/>
  <text x="696" y="170" class="bt">utils/ 基础设施</text>
  <rect x="696" y="180" width="308" height="30" rx="5" fill="#f5faff" stroke="#cfe4f7"/>
  <text x="706" y="193" class="bs" font-weight="700" fill="#1f2d3d">request.js</text>
  <text x="706" y="205" class="tag">wx.request 封装 · Promise · 错误提示</text>
  <rect x="696" y="216" width="308" height="30" rx="5" fill="#f5faff" stroke="#cfe4f7"/>
  <text x="706" y="229" class="bs" font-weight="700" fill="#1f2d3d">amap.js</text>
  <text x="706" y="241" class="tag">高德 SDK 初始化 · key 注入</text>
  <rect x="696" y="252" width="308" height="30" rx="5" fill="#f5faff" stroke="#cfe4f7"/>
  <text x="706" y="265" class="bs" font-weight="700" fill="#1f2d3d">format.js</text>
  <text x="706" y="277" class="tag">距离 / 星级展示格式化</text>
  <rect x="696" y="290" width="308" height="20" rx="4" fill="#fff7ed" stroke="#fcd9a8"/>
  <text x="706" y="304" class="tag">libs/amap-wx.130.js — 高德 SDK 本地文件</text>

  <!-- ========== 后端层 ========== -->
  <rect x="40" y="352" width="1000" height="248" rx="10" fill="#f1fbf5" stroke="#bfe6ce"/>
  <text x="58" y="376" class="band">后端服务（Express，Node.js）</text>
  <text x="58" y="394" class="tag">server/</text>

  <rect x="60" y="408" width="230" height="174" rx="8" fill="#fff" stroke="#a4d7b9"/>
  <text x="76" y="430" class="bt">routes/ HTTP 层</text>
  <text x="76" y="454" class="bs">routes.router.js</text>
  <text x="76" y="472" class="bs">comments.router.js</text>
  <text x="76" y="490" class="bs">roadConditions.router.js</text>
  <text x="76" y="508" class="bs" fill="#a0a8b0">runs.router.js（阶段二）</text>
  <line x1="76" y1="520" x2="274" y2="520" stroke="#dbe8e1"/>
  <text x="76" y="538" class="tag">middleware/</text>
  <text x="76" y="552" class="tag">userId · errorHandler</text>
  <text x="76" y="570" class="tag">validators/</text>

  <rect x="310" y="408" width="240" height="174" rx="8" fill="#fff" stroke="#a4d7b9"/>
  <text x="326" y="430" class="bt">services/ 业务逻辑</text>
  <text x="326" y="454" class="bs">routeService</text>
  <text x="326" y="472" class="bs">statsService ★</text>
  <text x="326" y="490" class="bs">difficultyService ★</text>
  <text x="326" y="508" class="bs">commentService</text>
  <text x="326" y="526" class="bs">roadConditionService</text>
  <text x="326" y="544" class="bs" fill="#a0a8b0">runService / scoringService</text>
  <line x1="326" y1="554" x2="534" y2="554" stroke="#dbe8e1"/>
  <text x="326" y="571" class="tag">★ 纯函数，重点单测</text>

  <rect x="570" y="408" width="180" height="174" rx="8" fill="#fffdf5" stroke="#e8d49a"/>
  <text x="586" y="430" class="bt">geo/ 几何计算</text>
  <text x="586" y="454" class="bs">haversine.js</text>
  <text x="586" y="472" class="bs">bearing.js</text>
  <text x="586" y="490" class="bs">turnAngle.js</text>
  <text x="586" y="508" class="bs">radius.js</text>
  <line x1="586" y1="520" x2="734" y2="520" stroke="#efe3bd"/>
  <text x="586" y="538" class="tag">无 IO、无依赖</text>
  <text x="586" y="552" class="tag">纯数学</text>
  <text x="586" y="570" class="tag">可独立测试</text>

  <rect x="770" y="408" width="250" height="174" rx="8" fill="#fff" stroke="#a4d7b9"/>
  <text x="786" y="430" class="bt">repositories/</text>
  <text x="786" y="454" class="bs">routeRepo</text>
  <text x="786" y="472" class="bs">commentRepo</text>
  <text x="786" y="490" class="bs">roadConditionRepo</text>
  <text x="786" y="508" class="bs" fill="#a0a8b0">runRepo</text>
  <line x1="786" y1="520" x2="1004" y2="520" stroke="#dbe8e1"/>
  <text x="786" y="538" class="tag">唯一写 SQL 的地方</text>
  <text x="786" y="552" class="tag">service 不感知 SQL</text>

  <!-- 后端内部流向 -->
  <line x1="290" y1="478" x2="310" y2="478" stroke="#4a8f68" stroke-width="1.4" marker-end="url(#aA)"/>
  <line x1="550" y1="462" x2="570" y2="462" stroke="#4a8f68" stroke-width="1.4" marker-end="url(#aA)"/>
  <line x1="570" y1="496" x2="550" y2="496" stroke="#c0a86b" stroke-width="1.4" marker-end="url(#aA)"/>
  <text x="552" y="524" class="tag" fill="#a08840">调用 / 返回</text>
  <line x1="550" y1="548" x2="770" y2="548" stroke="#4a8f68" stroke-width="1.4" marker-end="url(#aA)"/>
  <text x="600" y="542" class="tag" fill="#4a8f68">调用 repo</text>

  <!-- ========== 数据层 ========== -->
  <rect x="40" y="640" width="1000" height="132" rx="10" fill="#fdf7f0" stroke="#e8cfb0"/>
  <text x="58" y="664" class="band">数据层</text>
  <text x="140" y="664" class="tag">PostgreSQL 16 + PostGIS 3.4（Docker）· 阶段一坐标存 JSONB，不启用空间类型</text>

  <rect x="60" y="676" width="200" height="74" rx="8" fill="#fff" stroke="#dcbe95"/>
  <text x="76" y="698" class="bt">routes</text>
  <text x="76" y="716" class="bs">reference_track JSONB</text>
  <text x="76" y="732" class="bs">start / end_point JSONB</text>

  <rect x="276" y="676" width="180" height="74" rx="8" fill="#fff" stroke="#dcbe95"/>
  <text x="292" y="698" class="bt">comments</text>
  <text x="292" y="716" class="bs">routeId · userId</text>
  <text x="292" y="732" class="bs">content · createdAt</text>

  <rect x="472" y="676" width="200" height="74" rx="8" fill="#fff" stroke="#dcbe95"/>
  <text x="488" y="698" class="bt">road_conditions</text>
  <text x="488" y="716" class="bs">routeId · userId</text>
  <text x="488" y="732" class="bs">content · createdAt</text>

  <rect x="688" y="676" width="332" height="74" rx="8" fill="#fafbfc" stroke="#d5dde4" stroke-dasharray="4,3"/>
  <text x="704" y="698" class="bt" fill="#8b98a5">run_records（阶段二）</text>
  <text x="704" y="716" class="bs">raw_track_points JSONB</text>
  <text x="704" y="732" class="bs">score · rank · expires_at</text>

  <!-- ========== 外部依赖 ========== -->
  <rect x="40" y="792" width="1000" height="66" rx="10" fill="#f6f4fb" stroke="#d5cdec"/>
  <text x="58" y="816" class="band">外部依赖</text>
  <rect x="300" y="800" width="420" height="48" rx="8" fill="#fff" stroke="#c9bfe4"/>
  <text x="316" y="820" class="bt">高德开放平台（微信小程序 Key）</text>
  <text x="316" y="838" class="bs">地图组件渲染 · 点选坐标 · 轨迹绘制 —— 小程序端直连，不经后端</text>

  <!-- ========== 跨层连线 ========== -->
  <line x1="210" y1="330" x2="210" y2="352" stroke="#5a6b7d" stroke-width="1.4" marker-end="url(#aA)"/>
  <text x="218" y="347" class="note">HTTPS / JSON</text>
  <line x1="895" y1="582" x2="895" y2="636" stroke="#5a6b7d" stroke-width="1.4" marker-end="url(#aA)"/>
  <text x="903" y="622" class="note">pg 参数化查询</text>
</svg>
